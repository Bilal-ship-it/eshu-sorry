<!DOCTYPE html>
<html>

<head>

<title>Thank You Eshu ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
    radial-gradient(circle,#222,#000);

    color:white;

    font-family:Georgia,serif;

}



/* MAIN */

.container{

    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;

}



/* PEOPLE */

.person{

    text-align:center;

    animation:float 3s infinite ease-in-out;

}


.person img{

    width:150px;
    height:150px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #aaa;

    box-shadow:0 0 30px #555;

}


.person h2{

    margin-top:15px;

    font-size:22px;

}



/* MIDDLE MESSAGE */

.message{

    text-align:center;

    font-size:35px;

    font-weight:bold;

    animation:juggle 1.5s infinite ease-in-out;

}



.message span{

    display:block;

    animation:emotion 2s infinite;

}



@keyframes juggle{

0%{
transform:translateY(0) rotate(-5deg);
}


50%{
transform:translateY(-40px) rotate(5deg);
}


100%{
transform:translateY(0) rotate(-5deg);
}

}



@keyframes emotion{

0%{

color:white;

transform:scale(1);

}


50%{

color:#ff9fcf;

transform:scale(1.2);

}


100%{

color:white;

transform:scale(1);

}

}




@keyframes float{

50%{

transform:translateY(-15px);

}

}



.heart{

position:absolute;

font-size:25px;

animation:rise 5s linear infinite;

}


@keyframes rise{

from{

transform:translateY(100vh);

opacity:1;

}


to{

transform:translateY(-100vh);

opacity:0;

}

}


</style>

</head>


<body>



<div class="container">



<div class="person">

<img src="me.jpg">

<h2>Me ❤️</h2>

</div>




<div class="message">

<span>I LOVV YOU</span>

<span>SOO MUCH ❤️</span>

<span>THANKK YOUUU 🥺</span>

</div>




<div class="person">

<img src="eshuu.jpg">

<h2>Eshu ❤️</h2>

</div>



</div>




<script>


for(let i=0;i<30;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

h.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(h);

}


</script>


</body>

</html>
